[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "modelops-backend"
version = "0.1.0"
description = "Multi-model routing and evaluation for AI teams — route each query to the cheapest model that still meets your quality bar."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Rahul", email = "rahulsagar280103@gmail.com" }]
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "sqlalchemy[asyncio]>=2.0.25",
    "alembic>=1.13",
    "asyncpg>=0.29",
    "greenlet>=3.0",
    "redis>=5.0",
    "httpx>=0.26",
    "structlog>=24.1",
]

[project.optional-dependencies]
# Provider SDKs are optional so the router, evals and API can be tested — and
# a customer can run a single-provider deployment — without installing three
# vendor clients. Each adapter raises an actionable error if its SDK is absent.
anthropic = ["anthropic>=0.25"]
openai = ["openai>=1.20"]
gemini = ["google-generativeai>=0.5"]
providers = [
    "anthropic>=0.25",
    "openai>=1.20",
    "google-generativeai>=0.5",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.1",
    "aiosqlite>=0.19",
    "fakeredis>=2.21",
    "black>=24.1",
    "mypy>=1.9",
    "ruff>=0.3",
    "types-redis>=4.6",
]

[project.scripts]
modelops = "app.cli:main"

[project.urls]
Homepage = "https://github.com/4ahul/modelops"
Documentation = "https://github.com/4ahul/modelops/tree/main/docs"

[tool.setuptools.packages.find]
where = ["backend"]
include = ["app*"]

[tool.setuptools.package-data]
app = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["backend", "sdk/python"]
filterwarnings = ["error::DeprecationWarning:app.*"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
ignore = ["E501", "B008"]  # B008: FastAPI Depends() in defaults is the idiom

[tool.ruff.lint.isort]
# Without this, ruff treats the source roots as third-party and sorts app
# imports among the vendor ones.
known-first-party = ["app", "modelops", "tests"]

[tool.ruff.lint.per-file-ignores]
# ASYNC240 flags pathlib in async functions, which matters for a request handler
# and not for a fixture deleting a temp database file.
"tests/*" = ["ASYNC240"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
plugins = []

[tool.coverage.run]
source = ["backend/app", "sdk/python/modelops"]
omit = ["*/migrations/*"]
