name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      # The suite runs on SQLite with fake providers, so no service containers
      # and no vendor keys are needed. A test that needs a real key is a test
      # that will be skipped and eventually deleted.
      - name: Test
        run: pytest -q --cov=app --cov=modelops --cov-report=term-missing

      - name: No vendor SDK is required to import the app
        # The three provider SDKs are optional extras. A stray top-level import
        # would make the whole service undeployable without all three installed.
        run: |
          python - <<'PY'
          import sys
          sys.path.insert(0, "backend")
          import app.main  # noqa: F401
          leaked = [m for m in ("anthropic", "openai", "google.generativeai")
                    if m in sys.modules]
          if leaked:
              sys.exit(f"provider SDKs imported eagerly: {leaked}")
          print("provider SDKs stay optional")
          PY

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check backend sdk tests
      - run: black --check backend sdk tests
      - run: mypy backend/app sdk/python/modelops

  migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: modelops
          POSTGRES_PASSWORD: modelops_dev
          POSTGRES_DB: modelops_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U modelops"
          --health-interval 5s --health-timeout 5s --health-retries 10

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"

      - name: Upgrade, then downgrade
        # A migration that cannot be reverted is a migration you cannot deploy
        # on a Friday. Both directions run against real Postgres.
        env:
          DATABASE_URL: postgresql+asyncpg://modelops:modelops_dev@localhost:5432/modelops_test
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head

      - name: Migrations match the models
        # Autogenerate must produce nothing. If it does, the schema has drifted
        # from the SQLAlchemy models and the next deploy is a surprise.
        env:
          DATABASE_URL: postgresql+asyncpg://modelops:modelops_dev@localhost:5432/modelops_test
        run: |
          alembic revision --autogenerate -m drift_check --rev-id drift_check
          python - <<'PY'
          import pathlib, re, sys
          path = next(pathlib.Path("backend/migrations/versions").glob("*drift_check*.py"))
          body = path.read_text()
          upgrade = body.split("def upgrade()")[1].split("def downgrade()")[0]
          operations = [ln for ln in upgrade.splitlines() if re.search(r"\bop\.", ln)]
          path.unlink()
          if operations:
              sys.exit("models have drifted from the migrations:\n" + "\n".join(operations))
          print("schema matches the models")
          PY

  docker:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: modelops
          POSTGRES_PASSWORD: modelops_dev
          POSTGRES_DB: modelops_docker
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U modelops"
          --health-interval 5s --health-timeout 5s --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Build the image
        run: docker build -t modelops:ci .

      - name: Migrate with the image
        # The same image runs migrations and serves traffic, so a deploy cannot
        # apply a migration built from different code than the one it runs.
        run: |
          docker run --rm --network host \
            -e DATABASE_URL=postgresql+asyncpg://modelops:modelops_dev@localhost:5432/modelops_docker \
            modelops:ci alembic upgrade head

      - name: The image starts and answers /health
        run: |
          docker run -d --name modelops-ci --network host \
            -e ENVIRONMENT=development \
            -e DATABASE_URL=postgresql+asyncpg://modelops:modelops_dev@localhost:5432/modelops_docker \
            modelops:ci
          for _ in $(seq 1 30); do
            if curl -fsS http://localhost:8000/health > /tmp/health.json; then break; fi
            sleep 2
          done
          cat /tmp/health.json
          # No provider keys are set, so "degraded" is the correct answer and
          # the database must still report reachable.
          python - <<'PY'
          import json
          health = json.load(open("/tmp/health.json"))
          assert health["status"] in ("ok", "degraded"), health
          assert health["database"] is True, health
          print("image healthy:", health["status"])
          PY

      - name: Container runs as a non-root user
        run: |
          test "$(docker run --rm modelops:ci id -u)" != "0"

      - name: Logs
        if: always()
        run: docker logs modelops-ci || true

      - name: Clean up
        if: always()
        run: docker rm -f modelops-ci || true
